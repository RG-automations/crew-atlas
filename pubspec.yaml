name: crew_atlas
description: "CrewAtlas - shared trip planner for travel groups (Flutter, Android prototype)."
publish_to: 'none'
version: 0.5.1+6

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_svg: ^2.4.0
  geolocator: ^14.1.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  maplibre_gl: ^0.27.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  record: ^7.2.0
  url_launcher: ^6.3.3
  video_compress: ^3.1.4
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#00897B"
  adaptive_icon_foreground: "assets/icon_fg.png"
  adaptive_icon_monochrome: "assets/icon_mono.png"
